name: 发布 Windows 桌面版

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: 构建并发布 Windows 安装包
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sites-app/package-lock.json

      - name: 准备 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装前端依赖
        working-directory: sites-app
        run: npm ci

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: sites-app
          tauriScript: npm run tauri
          tagName: v__VERSION__
          releaseName: 人生攻略库 v__VERSION__
          releaseBody: |
            人生攻略库 0.4 完成了个人工作台的基础闭环收口：

            - 新增本周主/副结果和每日收尾，连接计划、执行与回顾。
            - 待整理内容可直接分流为笔记、探索资料、项目行动或提案。
            - 笔记使用稳定项目 ID 关联，项目改名不再造成关系漂移。
            - 项目保存、行动完成和推进轨迹采用事务保护，避免部分写入。
            - 专注投入重新接入行动界面，并新增安全的最近备份恢复入口。
            - 完整本地工作台会进入 SQLite 备份；云同步范围在界面中明确为笔记。

            已安装 v0.2.1 或更高版本时，可直接在应用内检查并安装更新。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
