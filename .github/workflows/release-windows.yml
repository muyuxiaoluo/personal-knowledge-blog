name: 发布 Windows 桌面版

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: 构建并发布 Windows 安装包
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sites-app/package-lock.json

      - name: 准备 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装前端依赖
        working-directory: sites-app
        run: npm ci

      - name: 运行桌面端测试
        working-directory: sites-app
        run: npm test

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: sites-app
          tauriScript: npm run tauri
          tagName: v__VERSION__
          releaseName: 人生攻略库 v__VERSION__
          releaseBody: |
            本版本的具体改动与升级说明见下方自动生成的发布记录。

            已安装支持自动更新的版本时，可直接在应用内检查并安装更新。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
