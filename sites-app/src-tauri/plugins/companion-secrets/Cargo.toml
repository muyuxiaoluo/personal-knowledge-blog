[package]
name = "tauri-plugin-companion-secrets"
version = "0.1.0"
authors = [ "Muyuxiaoluo" ]
description = ""
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-companion-secrets"

[dependencies]
tauri = { version = "2.11.3" }
serde = "1.0"
thiserror = "2"
serde_json = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
